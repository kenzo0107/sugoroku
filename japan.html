<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本一周すごろく チェックシート</title>
  </head>
  <body data-board="japan">
    <header class="app-header japan">
      <h1>🗾 <ruby>日本一周<rt>にほんいっしゅう</rt></ruby>すごろく チェックシート</h1>
      <a class="board-link" href="./index.html">🌏 <ruby>世界<rt>せかい</rt></ruby>のすごろくへ</a>
    </header>
    <main>
      <form id="add-player" class="add-player">
        <input id="player-name" type="text" placeholder="なまえ" maxlength="20" required />
        <select id="player-course" required></select>
        <button type="submit"><ruby>参加<rt>さんか</rt></ruby>する</button>
      </form>
      <section id="players" class="players"></section>
    </main>
    <div id="dice-stage" class="dice-stage" hidden>
      <div class="dice-mover"></div>
      <p class="dice-caption"></p>
    </div>
    <div class="dice-dock">
      <output id="dice-result" class="dice-result" aria-live="polite"></output>
      <button id="roll" type="button" class="dice-button">🎲 サイコロをふる</button>
    </div>
    <script type="module" src="/src/checklist.ts"></script>
  </body>
</html>
